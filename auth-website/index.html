(function(){const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.replace(/^#/,""));const get=k=>h.get(k)||q.get(k)||"";const err=get("error_description")||get("error")||get("error_code");const access=get("access_token"),refresh=get("refresh_token"),code=get("code"),type=get("type")||"signup";const title=document.getElementById("title"),desc=document.getElementById("desc"),state=document.getElementById("state"),open=document.getElementById("openApp"),retry=document.getElementById("retry");function show(t,d,s){title.textContent=t;desc.textContent=d;state.textContent=s;retry.classList.remove("hidden")}if(err){const expired=/expired|invalid|otp_expired/i.test(err);show(expired?"This verification link has expired":"We couldn't verify this link",expired?"For your security, this link can no longer be used. Return to OTS Transport and request a fresh verification email.":"The link may be invalid or already used. Return to the app and request a new verification email if needed.",expired?"Link expired":"Verification unsuccessful")}else if(access||code){show("Your account link is confirmed","Your verification link was accepted. Continue in OTS Transport to sign in and finish setting up your account.","Verification link accepted");if(access){open.href="ots-transport://auth-callback#access_token="+encodeURIComponent(access)+"&refresh_token="+encodeURIComponent(refresh)+"&type="+encodeURIComponent(type)}else{open.href="ots-transport://auth-callback?code="+encodeURIComponent(code)}open.classList.remove("hidden")}else{show("Welcome to OTS Transport","This page handles account confirmation links. Open the app to sign in, or use the verification link from your email.","OTS Transport account support")}})();
